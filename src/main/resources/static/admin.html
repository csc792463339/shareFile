<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台 - FlashShare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f7ff 0%, #f9fbff 100%);
            min-height: 100vh;
        }
        .login-card {
            max-width: 420px;
            margin: 100px auto;
        }
        .admin-container {
            display: none;
            padding: 20px 0 40px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #fff;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(28, 55, 90, 0.08);
        }
        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: #0d6efd;
        }
        .stat-label {
            color: #667085;
            font-size: 14px;
        }
        .share-card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #edf2f7;
            margin-bottom: 12px;
        }
        .share-id {
            font-size: 24px;
            font-weight: 700;
            color: #0d6efd;
            letter-spacing: 1px;
        }
        .text-content {
            color: #1f2937;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .toolbar .form-select {
            min-width: 130px;
        }
        .pagination-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            gap: 12px;
            flex-wrap: wrap;
        }
        @media (max-width: 992px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 576px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div id="loginSection">
    <div class="container">
        <div class="card login-card shadow border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-shield-alt fa-3x text-primary mb-3"></i>
                    <h3 class="fw-bold">管理员登录</h3>
                    <p class="text-muted mb-0">请输入管理员口令</p>
                </div>
                <form id="loginForm">
                    <div class="mb-3">
                        <input type="password" class="form-control form-control-lg" id="passwordInput"
                               placeholder="请输入口令" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="fas fa-sign-in-alt me-2"></i>登录
                    </button>
                    <div id="loginError" class="alert alert-danger mt-3 d-none"></div>
                </form>
            </div>
        </div>
    </div>
</div>

<div id="adminSection" class="admin-container">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0 text-primary">
                <i class="fas fa-tachometer-alt me-2"></i>管理员后台
            </h2>
            <button class="btn btn-outline-secondary" onclick="logout()">
                <i class="fas fa-sign-out-alt me-2"></i>退出登录
            </button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">总分享数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="fileCount">0</div>
                <div class="stat-label">文件分享</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="textCount">0</div>
                <div class="stat-label">文本分享</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalViews">0</div>
                <div class="stat-label">总访问次数</div>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-0 py-3">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h5 class="mb-0 fw-bold">
                        <i class="fas fa-list me-2"></i>分享记录
                    </h5>
                    <div class="toolbar d-flex gap-2">
                        <select class="form-select form-select-sm" id="typeFilter">
                            <option value="all">全部类型</option>
                            <option value="file">仅文件</option>
                            <option value="text">仅文本</option>
                        </select>
                        <select class="form-select form-select-sm" id="sortSelect">
                            <option value="createTimeDesc">创建时间降序</option>
                            <option value="createTimeAsc">创建时间升序</option>
                        </select>
                        <select class="form-select form-select-sm" id="sizeSelect">
                            <option value="20">20 / 页</option>
                            <option value="50">50 / 页</option>
                            <option value="100">100 / 页</option>
                        </select>
                        <button class="btn btn-sm btn-primary" id="refreshBtn">
                            <i class="fas fa-sync-alt me-1"></i>刷新
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body p-3 p-md-4">
                <div id="sharesList"></div>
                <div id="emptyState" class="text-center py-5 d-none">
                    <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                    <p class="text-muted mb-0">暂无分享记录</p>
                </div>
                <div class="pagination-wrap" id="paginationWrap">
                    <div class="text-muted small" id="pageSummary">共 0 条</div>
                    <div class="btn-group">
                        <button class="btn btn-outline-secondary btn-sm" id="prevPageBtn">上一页</button>
                        <button class="btn btn-outline-secondary btn-sm" id="nextPageBtn">下一页</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let adminPassword = '';
    let currentPage = 0;
    let currentSize = 20;
    let currentType = 'all';
    let currentSort = 'createTimeDesc';
    let totalPages = 0;
    let totalItems = 0;

    const loginForm = document.getElementById('loginForm');
    const refreshBtn = document.getElementById('refreshBtn');
    const typeFilter = document.getElementById('typeFilter');
    const sortSelect = document.getElementById('sortSelect');
    const sizeSelect = document.getElementById('sizeSelect');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('passwordInput').value;
        const errorDiv = document.getElementById('loginError');
        errorDiv.classList.add('d-none');

        try {
            const response = await fetch('/api/admin/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            if (!response.ok) {
                throw new Error('口令错误，请重试');
            }

            adminPassword = password;
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminSection').style.display = 'block';
            await loadShares(0);
        } catch (error) {
            errorDiv.textContent = error.message;
            errorDiv.classList.remove('d-none');
        }
    });

    refreshBtn.addEventListener('click', () => loadShares(currentPage));
    typeFilter.addEventListener('change', () => {
        currentType = typeFilter.value;
        loadShares(0);
    });
    sortSelect.addEventListener('change', () => {
        currentSort = sortSelect.value;
        loadShares(0);
    });
    sizeSelect.addEventListener('change', () => {
        currentSize = Number(sizeSelect.value) || 20;
        loadShares(0);
    });
    prevPageBtn.addEventListener('click', () => {
        if (currentPage > 0) loadShares(currentPage - 1);
    });
    nextPageBtn.addEventListener('click', () => {
        if (currentPage + 1 < totalPages) loadShares(currentPage + 1);
    });

    async function loadShares(page = 0) {
        try {
            const params = new URLSearchParams({
                page: String(Math.max(page, 0)),
                size: String(currentSize),
                type: currentType,
                sort: currentSort
            });
            const response = await fetch(`/api/admin/shares?${params.toString()}`, {
                headers: { 'X-Admin-Password': adminPassword }
            });
            if (!response.ok) {
                throw new Error('获取数据失败');
            }

            const payload = await response.json();
            currentPage = payload.page || 0;
            totalPages = payload.totalPages || 0;
            totalItems = payload.totalItems || 0;
            displayShares(payload.items || []);
            updateStats(payload.stats || {});
            updatePagination();
        } catch (error) {
            alert('加载失败：' + error.message);
        }
    }

    function displayShares(items) {
        const container = document.getElementById('sharesList');
        const emptyState = document.getElementById('emptyState');

        if (!items.length) {
            container.innerHTML = '';
            emptyState.classList.remove('d-none');
            return;
        }

        emptyState.classList.add('d-none');
        container.innerHTML = items.map(share => {
            const remainingDays = getRemainingDays(share);
            const typeBadge = share.file
                ? '<span class="badge text-bg-primary ms-2">文件</span>'
                : '<span class="badge text-bg-secondary ms-2">文本</span>';
            const richTextBadge = share.richText ? '<span class="badge text-bg-info ms-1">富文本</span>' : '';

            return `
                <div class="share-card">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <span class="share-id">${escapeHtml(share.shareId || '')}</span>
                            ${typeBadge}
                            ${richTextBadge}
                        </div>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteShare('${escapeHtml(share.shareId || '')}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>

                    ${share.file ? `
                        <div class="mb-2">
                            <i class="fas fa-file me-2 text-primary"></i>
                            <strong>${escapeHtml(share.fileName || '-')}</strong>
                            <span class="text-muted ms-2">(${formatSize(share.size || 0)})</span>
                        </div>
                    ` : `
                        <div class="text-content mb-2">${escapeHtml((share.textContent || '').slice(0, 1000))}</div>
                    `}

                    <div class="d-flex flex-wrap gap-3 align-items-center text-muted small">
                        <span><i class="fas fa-calendar-plus me-1"></i>${formatDate(share.createTime)}</span>
                        <span><i class="fas fa-calendar-times me-1"></i>${formatDate(share.expireTime)}</span>
                        <span><i class="fas fa-hourglass-half me-1"></i>剩余 ${remainingDays}</span>
                        <span><i class="fas fa-eye me-1"></i>${share.viewCount || 0} 次访问</span>
                        <a href="/view.html?id=${encodeURIComponent(share.shareId || '')}" target="_blank" class="btn btn-sm btn-outline-primary">
                            <i class="fas fa-external-link-alt me-1"></i>查看
                        </a>
                    </div>
                </div>
            `;
        }).join('');
    }

    function updateStats(stats) {
        document.getElementById('totalCount').textContent = stats.total || 0;
        document.getElementById('fileCount').textContent = stats.file || 0;
        document.getElementById('textCount').textContent = stats.text || 0;
        document.getElementById('totalViews').textContent = stats.totalViews || 0;
    }

    function updatePagination() {
        const pageSummary = document.getElementById('pageSummary');
        const pageIndex = totalPages > 0 ? currentPage + 1 : 0;
        pageSummary.textContent = `第 ${pageIndex} / ${totalPages} 页，共 ${totalItems} 条`;
        prevPageBtn.disabled = currentPage <= 0;
        nextPageBtn.disabled = currentPage + 1 >= totalPages;
    }

    async function deleteShare(shareId) {
        if (!confirm(`确定要删除分享 #${shareId} 吗？`)) {
            return;
        }
        try {
            const response = await fetch(`/api/admin/shares/${encodeURIComponent(shareId)}`, {
                method: 'DELETE',
                headers: { 'X-Admin-Password': adminPassword }
            });
            if (!response.ok) {
                throw new Error('删除失败');
            }
            await loadShares(currentPage);
        } catch (error) {
            alert('删除失败：' + error.message);
        }
    }

    function logout() {
        adminPassword = '';
        currentPage = 0;
        totalPages = 0;
        totalItems = 0;
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('adminSection').style.display = 'none';
        document.getElementById('passwordInput').value = '';
        document.getElementById('sharesList').innerHTML = '';
    }

    function formatSize(bytes) {
        const value = Number(bytes) || 0;
        if (value < 1024) return value + ' B';
        if (value < 1024 * 1024) return (value / 1024).toFixed(2) + ' KB';
        if (value < 1024 * 1024 * 1024) return (value / (1024 * 1024)).toFixed(2) + ' MB';
        return (value / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    function formatDate(dateValue) {
        if (!dateValue) return '--';
        const date = new Date(dateValue);
        if (Number.isNaN(date.getTime())) return '--';
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}`;
    }

    function getRemainingDays(share) {
        if (Number.isFinite(share.remainingDays)) {
            return `${Math.max(share.remainingDays, 0)} 天`;
        }
        if (Number.isFinite(share.remainingSeconds)) {
            const days = Math.ceil(Math.max(share.remainingSeconds, 0) / 86400);
            return `${days} 天`;
        }
        if (share.expireTime) {
            const expire = new Date(share.expireTime);
            const ms = expire.getTime() - Date.now();
            const days = Math.max(Math.ceil(ms / 86400000), 0);
            return `${days} 天`;
        }
        return '--';
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
